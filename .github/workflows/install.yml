name: Install

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: "${{ matrix.profile }} @ Ubuntu ${{ matrix.ubuntu }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: "ubuntu:${{ matrix.ubuntu }}"

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
        profile: [docker, minimal, workstation]

    steps:
      - name: Bootstrap system tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -yq update
          # Prevent resolvconf post-install from failing on Docker-bound /etc/resolv.conf
          echo "resolvconf resolvconf/linkify-resolvconf boolean false" | debconf-set-selections
          apt-get -yq install apt-utils git sudo curl ca-certificates

      - name: Install a C compiler (24.04 workstation - test.sh builds a tree-sitter parser)
        if: matrix.ubuntu == '24.04' && matrix.profile == 'workstation'
        run: DEBIAN_FRONTEND=noninteractive apt-get -yq install gcc libc6-dev

      - name: Create non-root test user with passwordless sudo
        run: |
          useradd -m -s /bin/bash testuser
          echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers

      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Copy dotfiles to test user home
        run: |
          cp -r . /home/testuser/dotfiles
          chown -R testuser:testuser /home/testuser/dotfiles

      - name: Configure curl auth (avoids GitHub API rate limit)
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.GITHUB_TOKEN }}" \
            > /home/testuser/.curlrc
          chown testuser:testuser /home/testuser/.curlrc
          chmod 600 /home/testuser/.curlrc

      - name: Install (${{ matrix.profile }})
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; cd ~/dotfiles && bash install.sh ${{ matrix.profile }}' testuser

      - name: Idempotency - re-run install.sh
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; cd ~/dotfiles && bash install.sh ${{ matrix.profile }}' testuser

      - name: Run test suite
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh ${{ matrix.profile }}' testuser

      - name: Seed nvim v0.9.5 as on a master-era host (20.04 workstation - update.sh must upgrade it)
        if: matrix.ubuntu == '20.04' && matrix.profile == 'workstation'
        run: |
          cd /home/testuser/dotfiles
          DOTFILES_DIR=$PWD bash -c 'set -euo pipefail; source lib/utils.sh; detect_sudo; source modules/neovim.sh; _neovim_legacy_binary /usr/local'
          v=$(/usr/local/bin/nvim --version | head -1); echo "$v"; [ "$v" = "NVIM v0.9.5" ]

      - name: Run update.sh
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; cd ~/dotfiles && bash update.sh' testuser

      - name: Re-run test suite after update
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh ${{ matrix.profile }}' testuser

  nvim-version-gates:
    name: "nvim ${{ matrix.nvim }}, ${{ matrix.label }} @ Ubuntu 22.04"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: "ubuntu:22.04"

    strategy:
      fail-fast: false
      matrix:
        # `include` with no base matrix keys creates exactly these cells; a bare
        # `nvim:` key would make include MERGE into those combinations instead.
        # 0.10 and 0.11 are the versions init.lua's `cond` gates switch on, and
        # the measured glibc floors (2.29, 2.34) are both met by 22.04's 2.35.
        #
        # The 0.11.5 pair covers both sides of the `fzf_ok` gate: with no build
        # tools telescope-fzf-native cannot build and load_extension('fzf') must
        # be skipped; with them it builds and the extension must load. Keep both -
        # the toolless cell is what caught the dead-telescope bug fixed in 1.11.1,
        # and only the build cell exercises the path nearly every dev box takes.
        include:
          - { nvim: "0.10.4", tools: none,  label: "no build tools" }
          - { nvim: "0.11.5", tools: none,  label: "no build tools" }
          - { nvim: "0.11.5", tools: build, label: "with build tools" }

    steps:
      - name: Bootstrap system tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -yq update
          # Prevent resolvconf post-install from failing on Docker-bound /etc/resolv.conf
          echo "resolvconf resolvconf/linkify-resolvconf boolean false" | debconf-set-selections
          apt-get -yq install apt-utils git sudo curl ca-certificates

      - name: Install build tools (the fzf_ok=true path - fzf-native must build and load)
        if: matrix.tools == 'build'
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get -yq install make gcc libc6-dev
          # init.lua's fzf_ok needs make AND an executable `cc`; installing gcc
          # provides /usr/bin/cc through alternatives (ubuntu:22.04 -> gcc-11).
          # Assert both, or a base-image change would silently make fzf_ok false
          # and turn this cell into a copy of the toolless one: green, proving nothing.
          command -v make >/dev/null || { echo "make missing - fzf_ok would be false"; exit 1; }
          [ -x /usr/bin/cc ]        || { echo "/usr/bin/cc missing - fzf_ok would be false and this cell would duplicate the toolless one"; exit 1; }
          echo "build tools present: make=$(command -v make) cc=$(readlink -f /usr/bin/cc)"

      - name: Create non-root test user with passwordless sudo
        run: |
          useradd -m -s /bin/bash testuser
          echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers

      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Copy dotfiles to test user home
        run: |
          cp -r . /home/testuser/dotfiles
          chown -R testuser:testuser /home/testuser/dotfiles

      - name: Configure curl auth (avoids GitHub API rate limit)
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.GITHUB_TOKEN }}" \
            > /home/testuser/.curlrc
          chown testuser:testuser /home/testuser/.curlrc
          chmod 600 /home/testuser/.curlrc

      - name: Install (minimal)
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; cd ~/dotfiles && bash install.sh minimal' testuser

      - name: Pin nvim to v${{ matrix.nvim }}
        run: |
          # /usr/local/bin precedes /usr/bin, so this shadows the apt nvim the
          # minimal profile just installed. Both tags ship nvim-linux-x86_64.tar.gz
          # with a bin/lib/share top level and no top-level man/, so copying into
          # /usr/local cannot hit the symlink clash _neovim_legacy_binary works
          # around for 0.9.5.
          tag="v${{ matrix.nvim }}"
          tmp=$(mktemp -d)
          curl -sfL "https://github.com/neovim/neovim/releases/download/${tag}/nvim-linux-x86_64.tar.gz" \
            | tar -xz -C "$tmp"
          cp -r "$tmp/nvim-linux-x86_64/." /usr/local/
          v=$(/usr/local/bin/nvim --version | head -1)
          echo "$v"
          # The tag must ship what it claims: neovim-releases' v0.12.5 shipped a 0.13 nightly.
          [ "$v" = "NVIM ${tag}" ]

      - name: Run test suite (minimal)
        run: su -s /bin/bash -c 'HOME=/home/testuser; export HOME; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh minimal' testuser

  git-partial-clone-gate:
    name: "git without partial clone @ Ubuntu 16.04"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Static check the container script
        run: |
          bash -n tests/ci-old-git.sh
          command -v shellcheck >/dev/null || sudo apt-get -yq install shellcheck >/dev/null
          shellcheck -S warning tests/ci-old-git.sh

      # Deliberately NOT `container: ubuntu:16.04`: actions/checkout runs on
      # Node 20/24, which needs glibc >= 2.28 while 16.04 ships 2.23, so the
      # checkout step fails before anything is tested (measured on PR #50).
      # Check out on the runner, run the old userland in docker instead.
      - name: Install and test under git 2.7.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD":/dotfiles:ro ubuntu:16.04 \
            bash /dotfiles/tests/ci-old-git.sh

  tmux-status-rows:
    name: "tmux multi-row tabs"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -yq update
          sudo apt-get -yq install tmux
          tmux -V

      - name: Static checks
        run: |
          bash -n tmux/tmux-status-rows
          bash -n tests/tmux-status-rows.sh
          sudo apt-get -yq install shellcheck
          shellcheck -S warning tmux/tmux-status-rows tests/tmux-status-rows.sh

      - name: Functional test
        run: TERM=xterm-256color bash tests/tmux-status-rows.sh

  install-nosudo:
    name: "nosudo-${{ matrix.variant }} @ Ubuntu ${{ matrix.ubuntu }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: "ubuntu:${{ matrix.ubuntu }}"

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
        variant:
          - auto       # user has NO sudo binary; detect_sudo() auto-detects CAN_SUDO=false
          - forced     # user HAS passwordless sudo but NOSUDO=1 overrides it
          - nonsudoer  # sudo binary present but user NOT in sudoers; auto-detects CAN_SUDO=false

    steps:
      - name: Bootstrap prerequisites (as root - mirrors a shared host)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -yq update
          apt-get -yq install apt-utils git curl wget ca-certificates zsh tmux python3

      - name: Install sudo binary (forced + nonsudoer)
        if: matrix.variant == 'forced' || matrix.variant == 'nonsudoer'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -yq install --no-install-recommends sudo

      - name: Grant passwordless sudo to user (forced only)
        # nonsudoer deliberately leaves the user OUT of sudoers so detect_sudo()
        # must auto-detect CAN_SUDO=false against a present-but-unauthorised sudo.
        if: matrix.variant == 'forced'
        run: echo 'user ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers

      - name: Create non-root user
        run: useradd -m -s /bin/bash user

      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Copy dotfiles to user home
        run: |
          cp -r . /home/user/dotfiles
          chown -R user:user /home/user/dotfiles

      - name: Configure curl auth (avoids GitHub API rate limit)
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.GITHUB_TOKEN }}" \
            > /home/user/.curlrc
          chown user:user /home/user/.curlrc
          chmod 600 /home/user/.curlrc

      - name: Install (${{ matrix.variant }})
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "forced" ]; then
            install_cmd="NOSUDO=1 bash install.sh minimal"
          else
            install_cmd="bash install.sh minimal"
          fi
          su -s /bin/bash -c \
            "HOME=/home/user; export HOME; export PATH=\"\$HOME/.local/bin:\$PATH\"; cd ~/dotfiles && $install_cmd" \
            user

      - name: Run test suite (nosudo profile)
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh nosudo' \
            user

      - name: Idempotency - re-run install.sh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "forced" ]; then
            install_cmd="NOSUDO=1 bash install.sh minimal"
          else
            install_cmd="bash install.sh minimal"
          fi
          su -s /bin/bash -c \
            "HOME=/home/user; export HOME; export PATH=\"\$HOME/.local/bin:\$PATH\"; cd ~/dotfiles && $install_cmd" \
            user

      - name: Run update.sh
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; cd ~/dotfiles && bash update.sh' \
            user

      - name: Re-run test suite after update
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh nosudo' \
            user

  install-nosudo-alma:
    name: "nosudo-${{ matrix.variant }} @ AlmaLinux ${{ matrix.alma }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: "almalinux:${{ matrix.alma }}"

    strategy:
      fail-fast: false
      matrix:
        alma: ["9", "10"]
        variant:
          - auto       # user has NO sudo binary; detect_sudo() auto-detects CAN_SUDO=false
          - forced     # user HAS passwordless sudo but NOSUDO=1 overrides it
          - nonsudoer  # sudo binary present but user NOT in sudoers; auto-detects CAN_SUDO=false

    steps:
      - name: Bootstrap prerequisites (as root - mirrors a shared RHEL host)
        # --allowerasing: EL9+ images ship curl-minimal, which conflicts with
        # the full curl package - allow dnf to swap it out.
        run: |
          dnf -yq install --allowerasing git curl wget ca-certificates zsh tmux python3 \
            tar gzip xz findutils shadow-utils glibc-langpack-en

      - name: Install sudo binary (forced + nonsudoer)
        if: matrix.variant == 'forced' || matrix.variant == 'nonsudoer'
        run: dnf -yq install sudo

      - name: Grant passwordless sudo to user (forced only)
        # nonsudoer deliberately leaves the user OUT of sudoers so detect_sudo()
        # must auto-detect CAN_SUDO=false against a present-but-unauthorised sudo.
        if: matrix.variant == 'forced'
        run: echo 'user ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers

      - name: Create non-root user
        run: useradd -m -s /bin/bash user

      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Copy dotfiles to user home
        run: |
          cp -r . /home/user/dotfiles
          chown -R user:user /home/user/dotfiles

      - name: Configure curl auth (avoids GitHub API rate limit)
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.GITHUB_TOKEN }}" \
            > /home/user/.curlrc
          chown user:user /home/user/.curlrc
          chmod 600 /home/user/.curlrc

      - name: Install (${{ matrix.variant }})
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "forced" ]; then
            install_cmd="NOSUDO=1 bash install.sh minimal"
          else
            install_cmd="bash install.sh minimal"
          fi
          su -s /bin/bash -c \
            "HOME=/home/user; export HOME; export PATH=\"\$HOME/.local/bin:\$PATH\"; cd ~/dotfiles && $install_cmd" \
            user

      - name: Run test suite (nosudo profile)
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh nosudo' \
            user

      - name: Idempotency - re-run install.sh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "forced" ]; then
            install_cmd="NOSUDO=1 bash install.sh minimal"
          else
            install_cmd="bash install.sh minimal"
          fi
          su -s /bin/bash -c \
            "HOME=/home/user; export HOME; export PATH=\"\$HOME/.local/bin:\$PATH\"; cd ~/dotfiles && $install_cmd" \
            user

      - name: Run update.sh
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; cd ~/dotfiles && bash update.sh' \
            user

      - name: Re-run test suite after update
        run: |
          su -s /bin/bash -c \
            'HOME=/home/user; export HOME; export PATH="$HOME/.local/bin:$PATH"; export TERM=xterm-256color; cd ~/dotfiles && bash test.sh nosudo' \
            user

  # Required check for branch protection. Matrix cell names change whenever the
  # matrix does, so requiring them individually means editing the protection rule
  # in lockstep and silently losing coverage when a name drifts. Protection
  # requires THIS job only, and it fails unless every other job succeeded.
  ci-gate:
    name: "CI gate"
    # always(), so it still runs when a dependency fails: a required check that
    # never reports leaves the PR hanging instead of failing.
    if: always()
    needs:
      - install
      - nvim-version-gates
      - git-partial-clone-gate
      - tmux-status-rows
      - install-nosudo
      - install-nosudo-alma
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@v4

      - name: Assert the gate requires every job
        run: |
          # A new job that nobody adds to `needs` above would sit OUTSIDE the gate
          # while CI stayed green - coverage lost silently. Fail instead.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 tests/ci-gate-covers-all.py

      - name: Fail unless every required job succeeded
        run: |
          # String literals in a GitHub expression must be SINGLE-quoted; a
          # double-quoted one makes the whole workflow invalid. Never write the
          # expression delimiters in a comment either - GitHub scans comments too,
          # and an empty pair is itself a syntax error (both cost a run on PR #52).
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: ${results:-<none>}"
          # No results at all must NOT pass: "cannot tell" is not "fine".
          if [ -z "$results" ]; then
            echo "no dependency results - refusing to report success"; exit 1
          fi
          for r in $results; do
            if [ "$r" != success ]; then
              echo "a required job did not succeed: $r"; exit 1
            fi
          done
          echo "all required jobs succeeded"
